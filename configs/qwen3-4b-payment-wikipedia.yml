base_model: Qwen/Qwen3-4B
trust_remote_code: false
adapter: qlora
load_in_4bit: true
strict: false
chat_template: qwen3
datasets:
- path: data/processed/payment_train.messages.jsonl
  type: chat_template
  field_messages: messages
  roles_to_train:
  - assistant
  train_on_eos: turn
test_datasets:
- path: data/processed/payment_validation.messages.jsonl
  type: chat_template
  field_messages: messages
  roles_to_train:
  - assistant
  train_on_eos: turn
val_set_size: 0
dataset_prepared_path: artifacts/axolotl-payment-wikipedia
output_dir: outputs/qwen3-4b-payment-wikipedia
sequence_len: 2048
sample_packing: false
pad_to_sequence_len: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_linear: true
micro_batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 2
optimizer: paged_adamw_8bit
learning_rate: 0.0001
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
fp16: false
gradient_checkpointing: true
flash_attention: false
logging_steps: 1
save_total_limit: 2
save_safetensors: true
seed: 42
train_on_inputs: false
dataset_processes: 2
dataloader_num_workers: 0
sdp_attention: true
use_wandb: false
use_mlflow: false
hub_model_id: null
push_to_hub: false
base_model_revision: 1cfa9a7208912126459214e8b04321603b3df60c
group_by_length: true
plugins:
- axolotl.integrations.liger.LigerPlugin
liger_fused_linear_cross_entropy: true
liger_rms_norm: true
liger_rope: true
liger_glu_activation: true
eval_steps: 5
save_steps: 5
